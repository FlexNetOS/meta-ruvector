# cargo-audit configuration for the ruvector workspace.
#
# Ignored advisories MUST have a justification. Anything fixable should be
# fixed via a dependency bump rather than ignored here. Re-evaluate the
# `until` dates periodically.

[advisories]
ignore = [
    # ------------------------------------------------------------------
    # Vulnerabilities (genuinely no upstream fix available)
    # ------------------------------------------------------------------

    # rsa 0.9.x — Marvin Attack (timing sidechannel on RSA decryption).
    # No fixed upgrade is available from upstream `rsa`. We do not expose
    # an RSA decryption oracle: TLS in this workspace runs on rustls with
    # Ed25519/X25519 suites, and `rsa` is pulled only transitively (e.g.
    # SQL drivers, JWT verification paths) where we never decrypt
    # attacker-controlled ciphertexts under a long-lived RSA key.
    # Re-evaluate when the `rsa` crate ships a constant-time implementation.
    "RUSTSEC-2023-0071",

    # lz4_flex 0.10.0 — decompressing invalid data can leak uninitialized
    # memory. Pulled ONLY transitively: zenoh-transport 1.9.0 pins
    # `lz4_flex = "^0.10.0"` (cannot resolve to the patched 0.11.6+), and
    # zenoh 1.9.0 is the latest published release, so there is no upstream
    # upgrade path. Our own direct lz4_flex deps are already on 0.11.6
    # (patched). lz4_flex here is used solely by zenoh's transport-layer
    # compression of our own pub/sub traffic between agentic-robotics nodes,
    # not to decompress attacker-controlled input across a trust boundary.
    # Re-evaluate when zenoh ships a release that bumps lz4_flex to >=0.11.6.
    "RUSTSEC-2026-0041",

    # ------------------------------------------------------------------
    # "Unmaintained" warnings (informational, not vulnerabilities)
    # ------------------------------------------------------------------
    # These are pulled transitively through deps we do not control. They
    # are not exploitable on their own; they are notices that the upstream
    # crate is no longer accepting patches. We mute them to keep CI clean
    # and revisit when the parent dep migrates.

    "RUSTSEC-2021-0140",  # rusttype — transitive via plotters; pure rendering, no untrusted input
    "RUSTSEC-2022-0054",  # wee_alloc — transitive via wasm-bindgen-cli internals
    "RUSTSEC-2024-0370",  # proc-macro-error — build-time only (proc-macro), no runtime exposure
    "RUSTSEC-2024-0380",  # pqcrypto-dilithium — replaced by pqcrypto-mldsa, awaiting parent migration
    "RUSTSEC-2024-0381",  # pqcrypto-kyber — replaced by pqcrypto-mlkem, awaiting parent migration
    "RUSTSEC-2024-0384",  # instant — transitive via parking_lot/older time deps
    "RUSTSEC-2024-0388",  # derivative — transitive proc-macro
    "RUSTSEC-2024-0436",  # paste — transitive proc-macro, build-time only
    "RUSTSEC-2025-0119",  # number_prefix — transitive via indicatif rendering
    "RUSTSEC-2025-0124",  # rand_os — transitive, replaced by getrandom in modern code paths
    "RUSTSEC-2025-0134",  # rustls-pemfile — transitive; rustls itself is current
    "RUSTSEC-2025-0141",  # bincode — unmaintained notice; we pin a known-good version
    "RUSTSEC-2026-0105",  # core2 — transitive, no_std fallback for std::io types
    "RUSTSEC-2020-0016",  # net2 — deprecated transitive; parent migration to socket2 pending
    "RUSTSEC-2026-0162",  # pqcrypto-traits — unmaintained; parent PQ migration pending
    "RUSTSEC-2026-0163",  # pqcrypto-internals — unmaintained; parent PQ migration pending
    "RUSTSEC-2026-0173",  # proc-macro-error2 — transitive proc-macro, build-time only
    "RUSTSEC-2026-0192",  # ttf-parser — unmaintained; transitive font/rendering paths only
    "RUSTSEC-2024-0411",  # gtk-rs GTK3 gdkwayland-sys unmaintained; transitive desktop/UI path, not hailo runtime
    "RUSTSEC-2024-0412",  # gtk-rs GTK3 gdk unmaintained; transitive desktop/UI path, not hailo runtime
    "RUSTSEC-2024-0413",  # gtk-rs GTK3 atk unmaintained; transitive desktop/UI path, not hailo runtime
    "RUSTSEC-2024-0414",  # gtk-rs GTK3 gdkx11-sys unmaintained; transitive desktop/UI path, not hailo runtime
    "RUSTSEC-2024-0415",  # gtk-rs GTK3 gtk unmaintained; transitive desktop/UI path, not hailo runtime
    "RUSTSEC-2024-0416",  # gtk-rs GTK3 atk-sys unmaintained; transitive desktop/UI path, not hailo runtime
    "RUSTSEC-2024-0417",  # gtk-rs GTK3 gdkx11 unmaintained; transitive desktop/UI path, not hailo runtime
    "RUSTSEC-2024-0418",  # gtk-rs GTK3 gdk-sys unmaintained; transitive desktop/UI path, not hailo runtime
    "RUSTSEC-2024-0419",  # gtk-rs GTK3 gtk3-macros unmaintained; transitive desktop/UI path, not hailo runtime
    "RUSTSEC-2024-0420",  # gtk-rs GTK3 gtk-sys unmaintained; transitive desktop/UI path, not hailo runtime
    "RUSTSEC-2024-0429",  # glib iterator unsoundness; transitive desktop/UI path, not hailo runtime
    "RUSTSEC-2025-0057",  # fxhash unmaintained; transitive desktop/UI path, not hailo runtime

    # quick-xml 0.26 — quadratic duplicate-attribute check (2026-0194) and
    # NsReader namespace-allocation DoS (2026-0195). Reachable ONLY via
    # pprof -> inferno 0.11 behind ruvector-bench's optional `profiling`
    # feature; the XML parsed is locally generated flamegraph SVG, never
    # attacker-controlled input. Upstream-blocked: fix needs quick-xml
    # >=0.41 (inferno 0.12.7), but even pprof 0.15.0 still pins inferno
    # ^0.11. Re-evaluate when pprof releases with inferno >=0.12.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # ------------------------------------------------------------------
    # Soundness/unsoundness notices in deps we do not directly control
    # ------------------------------------------------------------------

    # lru — IterMut Stacked Borrows violation. Used transitively; we do
    # not call IterMut from the affected crate. Track parent dep upgrade.
    "RUSTSEC-2024-0408",

    # pprof — unsound `slice::from_raw_parts` usage. Only loaded behind
    # benchmark/profiling features, never in production binaries.
    "RUSTSEC-2026-0002",

    # rand — unsoundness when using a custom global logger with rand::rng().
    # We never install a custom logger in the rand call path. Awaiting
    # transitive upgrade across the workspace.
    "RUSTSEC-2026-0097",

    # imageproc 0.25.0 — three soundness notices (improper bounds checks in
    # image sampling). Used only in examples/scipix behind the optional
    # `preprocess` feature; not compiled into any production binary. No fixed
    # upstream release available yet. Re-evaluate on imageproc 0.26+.
    "RUSTSEC-2026-0115",
    "RUSTSEC-2026-0116",
    "RUSTSEC-2026-0117",

    # quick-xml 0.26.0 — two DoS advisories: unbounded namespace-declaration
    # allocation (RUSTSEC-2026-0195) and quadratic run time on duplicate
    # attribute-name checks (RUSTSEC-2026-0194). Both require quick-xml >=0.41,
    # but quick-xml is pinned transitively through the benchmark-only profiling
    # chain: ruvector-bench --(profiling feature)--> pprof 0.13 --> inferno
    # 0.11.21 --> quick-xml ^0.26. pprof 0.13 has no in-major release that moves
    # off inferno 0.11, so there is no compatible upgrade path without a pprof
    # major bump (breaking ruvector-bench). quick-xml here parses only our own
    # locally-generated flamegraph SVG during `cargo bench` profiling — it never
    # touches attacker-controlled XML and is never compiled into a production
    # binary (same benchmark-only basis as the pprof RUSTSEC-2026-0002 ignore).
    # Re-evaluate when pprof ships a release that pulls inferno with quick-xml
    # >=0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
