name: metabiohacker-ci

# CI gates for the MetaBioHacker stack (ADR-0013/0017/0018/0022/0024):
# frozen physics residual, mandatory pathology review, A/B-only claims,
# verifiable ledgers, and the real-slice honesty gate.

on:
  push:
    paths:
      - "crates/sonic-ct/**"
      - "crates/sonic-ct-wasm/**"
      - "packages/metabiohacker/**"

      - ".github/workflows/metabiohacker-ci.yml"
  pull_request:
    paths:
      - "crates/sonic-ct/**"
      - "crates/sonic-ct-wasm/**"
      - "packages/metabiohacker/**"

defaults:
  run:
    shell: nu {0}

jobs:
  rust-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nushell
        uses: hustcer/setup-nu@ccd5bb5426b05a32009c2ba967946231f3919c97 # v3.25
        with:
          version: 0.113.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: sonic_ct tests
        run: cd crates/sonic-ct; cargo test --release
      - name: sonic_ct clippy (lib)
        run: cd crates/sonic-ct; cargo clippy --release --lib -- -D warnings
      - name: build wasm
        run: nu scripts/build-sonic-ct-wasm.nu

  metabiohacker-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nushell
        uses: hustcer/setup-nu@ccd5bb5426b05a32009c2ba967946231f3919c97 # v3.25
        with:
          version: 0.113.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: install
        run: cd packages/metabiohacker; bun install --frozen-lockfile
      - name: CI gates + unit tests
        run: cd packages/metabiohacker; bun test
