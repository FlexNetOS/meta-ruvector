# AUTOMATION DISABLED: port every automatic command to Nushell before reactivation.
name: thermorust CI

on:
  push:
    paths:
      - "crates/thermorust/**"
      - ".github/workflows/thermorust-ci.yml"
  pull_request:
    paths:
      - "crates/thermorust/**"
      - ".github/workflows/thermorust-ci.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --package thermorust -- --check

      - name: Clippy
        run: cargo clippy --package thermorust --all-targets -- -D warnings

      - name: Build
        run: cargo build --package thermorust

      - name: Run tests
        run: cargo test --package thermorust

  bench-check:
    name: Benchmarks compile
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Check benchmarks compile
        run: cargo bench --package thermorust --no-run
