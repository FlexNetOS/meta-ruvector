# AUTOMATION DISABLED: port every automatic command to Nushell before reactivation.
name: Clippy + fmt

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  clippy:
    name: Clippy (deny warnings)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # Drop the broken third-party (Microsoft) apt repos preinstalled on the
        # ubuntu-26.04 runner image: their InRelease signatures intermittently
        # fail ("no longer signed" / NOSPLIT), which aborts `apt-get update`
        # (exit 100) even though our packages come from the main Ubuntu repos.
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
            \( -iname '*microsoft*' -o -iname '*azure*' \) -print -delete
          sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy (workspace, deny warnings)
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check
