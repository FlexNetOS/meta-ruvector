[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package]
name = "ruvector-graph-transformer-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Self-contained WASM graph-transformer implementation (proof-gated attention, verified training) for the browser"
readme = "README.md"
keywords = ["wasm", "graph-transformer", "attention", "verified", "webassembly"]
categories = ["wasm", "science", "mathematics"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"


# Lint debt allowlist: these lints fire on existing code and the workspace
# CI gate is `cargo clippy --all-targets -- -D warnings`. Allowed here so the
# gate stays red-free; groom the code, then remove entries.
[lints.clippy]
manual_checked_ops = "allow"
manual_div_ceil = "allow"
