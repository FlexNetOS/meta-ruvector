[package]
name = "ruvix-dtb"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Device Tree Blob parser for RuVix Cognition Kernel (ADR-087)"
keywords = ["kernel", "dtb", "devicetree", "no_std", "embedded"]
categories = ["no-std", "embedded", "parsing"]
repository = "https://github.com/FlexNetOS/ruvector"
readme = "README.md"

[lib]
crate-type = ["rlib"]

[dependencies]
ruvix-types = { version = "0.1.0", path = "../types" }

[dev-dependencies]
proptest = "1.5"

[features]
default = []
std = []
alloc = []

# Lint debt allowlist: these lints fire on existing code and the workspace
# CI gate is `cargo clippy --all-targets -- -D warnings`. Allowed here so the
# gate stays red-free; groom the code, then remove entries.
[lints.rust]
dead_code = "allow"
[lints.clippy]
iter_without_into_iter = "allow"
large_stack_arrays = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
needless_continue = "allow"
